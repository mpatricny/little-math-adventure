    #crocodile-mathboard * { box-sizing:border-box; }
    #crocodile-mathboard button { font-family:inherit; cursor:pointer; color:inherit; -webkit-tap-highlight-color:transparent; }
    #crocodile-mathboard button:disabled { cursor:default; }
    #crocodile-mathboard [hidden] { display:none !important; }
    #crocodile-mathboard .mc-steps { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; max-width:740px; margin:0 auto 12px; }
    #crocodile-mathboard .mc-step { border:1px solid #8c6c43; border-radius:9px; min-height:50px; padding:8px; background:#eee0bd; color:#65492d; font-size:14px; display:flex; align-items:center; justify-content:center; gap:9px; }
    #crocodile-mathboard .mc-step[aria-pressed=true] { background:#d1b378; color:#362417; box-shadow:inset 0 -3px #75532e; }
    #crocodile-mathboard .mc-step b { font-family:Georgia,serif; font-size:21px; }
    #crocodile-mathboard .mc-board { width:100%; max-width:740px; height:300px; margin:auto; position:relative; container-type:inline-size; border-style:solid; border-width:24px 45.3333px; border-image-source:var(--board-art); border-image-slice:90 170 90 170 fill; border-image-repeat:stretch; }
    #crocodile-mathboard .mc-board-art { display:none; }
    #crocodile-mathboard .mc-safe { position:relative; height:100%; padding:0 9px; display:grid; grid-template-rows:44px minmax(0,1fr) 44px; gap:6px; }
    #crocodile-mathboard .mc-header { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    #crocodile-mathboard .mc-heading { font-family:Georgia,serif; font-size:23px; line-height:1.1; margin:0; font-weight:600; color:#654123; }
    #crocodile-mathboard .mc-replay { display:flex; align-items:center; justify-content:center; border:1px solid #a38451; background:#fff2cf80; border-radius:50%; width:44px; height:44px; flex:none; }
    #crocodile-mathboard .mc-row { display:grid; grid-template-columns:minmax(0,1.28fr) minmax(0,1fr); column-gap:10px; align-items:center; min-height:0; position:relative; }
    #crocodile-mathboard .mc-problem { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,.8fr) minmax(0,1fr); column-gap:7px; align-items:center; min-height:0; }
    #crocodile-mathboard .mc-operand { display:flex; align-items:center; justify-content:center; flex-direction:column; gap:4px; min-width:0; position:relative; border-radius:15px; }
    #crocodile-mathboard .mc-food { display:grid; grid-template-columns:repeat(var(--food-columns,2),minmax(0,1fr)); gap:4px; width:100%; height:102px; align-content:center; align-items:center; justify-items:center; }
    #crocodile-mathboard .mc-food.single { display:flex; justify-content:center; }
    #crocodile-mathboard .mc-fruit { width:100%; max-width:44px; height:auto; display:block; filter:drop-shadow(0 3px 2px #75563222); }
    #crocodile-mathboard .mc-food.single .mc-fruit { max-width:none; }
    #crocodile-mathboard .mc-numeral { font-size:32px; font-weight:700; line-height:1; color:#3e3024; }
    #crocodile-mathboard .mc-number-only { font-size:64px; }
    #crocodile-mathboard .mc-slot { aspect-ratio:1; width:100%; position:relative; display:grid; place-items:center; border:2px dashed #9a7d4e; border-radius:14px; background:#fff8e333; }
    #crocodile-mathboard .mc-slot.filled { border-color:transparent; background:transparent; }
    #crocodile-mathboard .mc-mouth { display:block; width:100%; height:auto; overflow:visible; filter:drop-shadow(0 3px 1px #75563222); }
    #crocodile-mathboard .mc-slot .mc-mouth[data-plain=true] { width:52px; max-width:74%; }
    #crocodile-mathboard .mc-answers { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:4px; align-items:center; }
    #crocodile-mathboard .mc-choice { min-width:0; }
    #crocodile-mathboard .mc-memory { display:none; height:36px; margin-bottom:5px; place-items:center; pointer-events:none; visibility:hidden; }
    #crocodile-mathboard[data-stage="3"] .mc-memory { display:grid; }
    #crocodile-mathboard[data-hint="shown"] .mc-memory { visibility:visible; }
    #crocodile-mathboard .mc-memory .mc-mouth { width:40px; height:36px; filter:none; }
    #crocodile-mathboard .mc-answer { aspect-ratio:300/238; position:relative; width:100%; padding:10% 10.5%; background:transparent; border:0; min-height:60px; display:grid; place-items:center; border-radius:15px; }
    #crocodile-mathboard .mc-button-surface { position:absolute; inset:0; pointer-events:none; transition:transform .14s ease,filter .14s ease; }
    #crocodile-mathboard .mc-button-surface:before { content:""; position:absolute; inset:0; background:var(--button-art) center/contain no-repeat; }
    #crocodile-mathboard .mc-answer svg { position:absolute; left:16%; top:20%; width:68%; height:60%; }
    #crocodile-mathboard .mc-answer:not(:disabled):hover .mc-button-surface { filter:brightness(1.10); transform:translateY(-2px); }
    #crocodile-mathboard .mc-answer:not(:disabled):active .mc-button-surface { filter:brightness(.95); transform:translateY(1px); }
    #crocodile-mathboard .mc-answer:disabled { opacity:.42; }
    #crocodile-mathboard .mc-answer.chosen { opacity:1; }
    #crocodile-mathboard .mc-answer.chosen:after { content:""; position:absolute; inset:7% 6%; border:3px solid #4a793b; border-radius:12px; pointer-events:none; }
    #crocodile-mathboard .mc-answer.wrong:after { content:""; position:absolute; inset:7% 6%; border:3px solid #a54c34; border-radius:12px; pointer-events:none; }
    #crocodile-mathboard .mc-answer.wrong .mc-button-surface { animation:mc-shake .25s ease-out; }
    #crocodile-mathboard .mc-footer { display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:14px; min-height:46px; }
    #crocodile-mathboard .mc-progress { display:flex; gap:15px; align-items:center; }
    #crocodile-mathboard .mc-dots { display:flex; gap:5px; align-items:center; }
    #crocodile-mathboard .mc-dot { width:20px; height:20px; border-radius:50%; background:#c5ad80; display:grid; place-items:center; font-size:13px; color:#fff5db; }
    #crocodile-mathboard .mc-dot.active { outline:2px solid #77582f; outline-offset:2px; }
    #crocodile-mathboard .mc-dot.correct { background:#52733d; }
    #crocodile-mathboard .mc-dot.wrong { background:#9c5035; }
    #crocodile-mathboard .mc-power { display:flex; gap:5px; align-items:center; font-size:20px; color:#62452b; }
    #crocodile-mathboard .mc-power svg { width:23px; height:23px; }
    #crocodile-mathboard .mc-status { color:#526539; font-size:clamp(14px,1.65cqw,19px); min-height:23px; white-space:nowrap; }
    #crocodile-mathboard .mc-action { min-height:46px; padding:7px 14px; display:flex; align-items:center; gap:9px; border:2px solid #81643c; border-radius:9px; color:#4c331e; background:linear-gradient(#f3dbac,#d8b883); font-size:16px; font-weight:600; white-space:nowrap; }
    #crocodile-mathboard .mc-action:hover { background:#f8e6bd; }
    #crocodile-mathboard .mc-action:active { box-shadow:inset 0 2px 5px #7b542333; }
    #crocodile-mathboard .mc-action:disabled { opacity:.45; }
    #crocodile-mathboard .mc-hand { position:absolute; width:42px; height:42px; display:grid; place-items:center; background:#fff4d5; border:2px solid #876540; color:#574126; border-radius:50%; z-index:5; box-shadow:0 3px 9px #684d3333; }
    #crocodile-mathboard .mc-flying { position:absolute; z-index:4; pointer-events:none; }
    #crocodile-mathboard .mc-flying .mc-fruit { max-width:none; }
    #crocodile-mathboard .mc-emphasis { background:#e5e69b70; box-shadow:0 0 0 3px #8c9d4e55; }
    #crocodile-mathboard .mc-pair { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:3; }
    #crocodile-mathboard .mc-complete { display:none; grid-column:1/-1; justify-items:center; align-content:center; gap:10px; }
    #crocodile-mathboard .mc-strike { display:flex; align-items:center; gap:18px; font-size:57px; font-weight:700; color:#704722; }
    #crocodile-mathboard .mc-strike svg { width:64px; height:64px; }
    #crocodile-mathboard .mc-complete strong { font-family:Georgia,serif; font-size:27px; font-weight:500; }
    #crocodile-mathboard[data-button-style=light] .mc-button-surface:before { inset:7% 6%; border:2px solid #967143; border-radius:11px; background:#fbebc4; box-shadow:inset 0 -4px #d6b279,0 3px #85644144; }
    @keyframes mc-shake { 25% { transform:translateX(-3px); } 70% { transform:translateX(3px); } }
    @media(max-width:580px) {
      #crocodile-mathboard .mc-steps { gap:5px; }

      #crocodile-mathboard .mc-board-art { display:none; }
      #crocodile-mathboard .mc-safe { padding:10px 4px; grid-template-rows:auto 1fr auto; gap:12px; min-height:484px; }
      #crocodile-mathboard .mc-row { grid-template-columns:1fr; row-gap:12px; }
      #crocodile-mathboard .mc-problem { max-width:440px; width:100%; margin:auto; }
      #crocodile-mathboard .mc-answers { width:100%; max-width:340px; margin:auto; gap:9px; }
      #crocodile-mathboard .mc-answer { min-height:75px; }
      #crocodile-mathboard .mc-operand { min-height:125px; }
      #crocodile-mathboard .mc-food { height:102px; }
      #crocodile-mathboard .mc-numeral { font-size:39px; }
      #crocodile-mathboard .mc-number-only { font-size:68px; }
      #crocodile-mathboard .mc-slot .mc-mouth[data-plain=true] { width:54px; }
      #crocodile-mathboard .mc-heading { font-size:23px; }
      #crocodile-mathboard .mc-footer { grid-template-columns:1fr auto; row-gap:9px; }
      #crocodile-mathboard .mc-progress { grid-column:1/-1; justify-content:center; }
      #crocodile-mathboard .mc-action { padding:7px 10px; font-size:15px; }
    }
    @media(prefers-reduced-motion:reduce) { #crocodile-mathboard * { animation:none !important; transition:none !important; } }

        <div class="mc-complete" role="status" aria-live="polite"><div class="mc-strike"><i data-lucide="swords" aria-hidden="true"></i><span class="mc-strike-value">0</span></div></div>
      </div>
      <footer class="mc-footer">
        <div class="mc-progress"><div class="mc-dots" aria-label="Příklady v útoku"><span class="mc-dot active"></span><span class="mc-dot"></span><span class="mc-dot"></span></div><span class="mc-power" aria-label="Síla útoku 0"><i data-lucide="swords" aria-hidden="true"></i><b>0</b></span></div>
        <span class="mc-status" role="status" aria-live="polite"></span>
        <button class="mc-action" type="button" data-action="main"><i data-lucide="play" aria-hidden="true"></i><span>Ukázka</span></button>
      </footer>
    </div>
  </section>
  <script>
  (()=>{
    const root=document.getElementById('crocodile-mathboard');
    const q=s=>root.querySelector(s),all=s=>[...root.querySelectorAll(s)];
    const options={buttonStyle:'wood',demoSpeed:1,hintSchedule:'progress'};
    const supportDelays=[0,3000,6000,10000,null];
    const support={level:0,correct:0,recent:[]};
    let hintTimer=null,hintRemaining=null,hintStarted=0,hintGeneration=0;
    const examples=[[[5,2],[2,5],[3,3]],[[4,2],[2,4],[3,3]],[[4,2],[2,4],[3,3]],[[5,2],[2,5],[3,3]]];
    const practice=[[[2,5],[3,3],[5,2]],[[2,4],[3,3],[5,2]],[[2,4],[3,3],[5,2]],[[2,4],[3,3],[4,2]]];
    const state={stage:3,index:0,mode:'practice',result:null,busy:false,token:0,demoIndex:0,demoPhase:'none',selected:null,complete:false,results:[],damage:0,hintUsed:false,assisted:[]};
    const values=()=>state.mode==='demo'||state.mode==='demo-done'?examples[state.stage][state.demoIndex]:practice[state.stage][state.index];
    const relation=()=>{const[l,r]=values();return l===r?'=':l>r?'>':'<';};
    const glyphName=s=>s==='='?'Stejně':s==='<'?'Menší než':'Větší než';
    const icons=()=>{if(globalThis.lucide)globalThis.lucide.createIcons();};
    const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
    function glyph(sign,plain=false){
      let shape;
      if(plain)shape=sign==='='?'<path d="M30 69H210M30 158H210"/>':`<path d="M35 28L207 111L35 194" ${sign==='<'?'transform="translate(240 0) scale(-1 1)"':''}/>`;
      else shape=sign==='='?'<use href="#cc-equal"/>':`<use href="#cc-croc" ${sign==='<'?'transform="translate(240 0) scale(-1 1)"':''}/>`;
      return `<svg class="mc-mouth" data-plain="${plain}" viewBox="0 0 240 220" role="img" aria-label="${glyphName(sign)}"><g ${plain?'fill="none" stroke="#4a3826" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"':''}>${shape}</g></svg>`;
    }
    function operand(value){
      if(state.stage===3)return `<span class="mc-numeral mc-number-only">${value}</span>`;
      let html=`<div class="mc-food${state.stage===0?' single':''}" style="--food-columns:3">`;
      const count=state.stage===0?1:value;
      for(let i=0;i<count;i++)html+=`<svg class="mc-fruit" data-food="${i}" viewBox="0 0 100 106" aria-hidden="true" ${state.stage===0?`style="width:${value===5?98:value===2?51:76}%"`:''}><use href="#cc-apple"/></svg>`;
      return html+'</div>'+(state.stage===2?`<span class="mc-numeral">${value}</span>`:'');
    }
    function status(text){q('.mc-status').textContent=text;}
    function questionReady(){return state.stage===3&&state.mode==='practice'&&!state.busy&&state.result===null&&!state.complete;}
    function hideHint(){
      if(hintTimer!==null)clearTimeout(hintTimer);hintTimer=null;hintRemaining=null;hintGeneration++;
      root.dataset.hint='hidden';all('.mc-memory').forEach(el=>el.setAttribute('aria-hidden','true'));
    }
    function showHint(generation){
      if(generation!==hintGeneration||!questionReady()||document.hidden)return;
      hintTimer=null;hintRemaining=null;state.hintUsed=true;root.dataset.hint='shown';
      all('.mc-memory').forEach(el=>el.setAttribute('aria-hidden','false'));
    }
    function resumeHint(){
      if(hintTimer!==null||hintRemaining===null||!questionReady()||document.hidden)return;
      hintStarted=performance.now();const generation=hintGeneration;
      if(hintRemaining<=0)showHint(generation);else hintTimer=setTimeout(()=>showHint(generation),hintRemaining);
    }
    function armHint(){
      hideHint();root.dataset.supportLevel=support.level;
      const wait=options.hintSchedule==='progress'?supportDelays[support.level]:options.hintSchedule==='off'?null:Number(options.hintSchedule);
      root.dataset.hintDelay=wait===null?'off':wait;
      if(!questionReady()||wait===null)return;
      hintRemaining=wait;resumeHint();
    }
    function recordSupport(correct){
      if(state.stage!==3||options.hintSchedule!=='progress')return;
      support.recent.push(correct);support.recent=support.recent.slice(-4);
      if(!correct){
        support.correct=0;
        if(support.recent.filter(x=>!x).length>=2){support.level=Math.max(0,support.level-1);support.recent=[];}
      }else if(++support.correct>=2){
        support.level=Math.min(supportDelays.length-1,support.level+1);support.correct=0;support.recent=[];
      }
    }
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden&&hintTimer!==null){hintRemaining=Math.max(0,hintRemaining-(performance.now()-hintStarted));clearTimeout(hintTimer);hintTimer=null;}
      else if(!document.hidden)resumeHint();
    });
    function buttons(){
      const disabled=state.busy||state.mode==='demo-done'||state.result!==null||state.complete;
      all('.mc-answer').forEach(b=>{b.disabled=disabled;b.classList.toggle('chosen',b.dataset.sign===state.selected);});
      const main=q('[data-action="main"]');main.disabled=state.busy;main.hidden=state.busy&&state.mode==='practice';
      q('[data-action="replay"]').disabled=state.busy||state.complete;
      const label=state.complete?'Další tah':state.mode==='demo-done'?'Zkus to':'Ukázka';
      main.innerHTML=`<i data-lucide="${label==='Ukázka'?'play':'arrow-right'}" aria-hidden="true"></i><span>${label}</span>`;
      icons();
    }
    function summary(){
      root.dataset.index=state.index;root.dataset.damage=state.damage;root.dataset.results=state.results.map(v=>v?'1':'0').join('');root.dataset.assisted=state.assisted.map(v=>v?'1':'0').join('');root.dataset.complete=state.complete;
      q('.mc-progress').hidden=state.mode.startsWith('demo');
      all('.mc-dot').forEach((dot,i)=>{const result=state.results[i];dot.classList.toggle('active',i===state.index&&!state.complete);dot.classList.toggle('correct',result===true);dot.classList.toggle('wrong',result===false);dot.textContent=result===true?'✓':result===false?'×':'';dot.setAttribute('aria-label',`${i+1}: ${result===true?'správně':result===false?'chyba':i===state.index?'teď':'čeká'}`);});
      q('.mc-power b').textContent=state.damage;q('.mc-power').setAttribute('aria-label',`Síla útoku ${state.damage}`);
      q('.mc-strike-value').textContent=state.damage;q('.mc-complete').setAttribute('aria-label',`Útok silou ${state.damage}`);
    }
    function render(){
      all('.mc-flying,.mc-hand,.mc-pair').forEach(e=>e.remove());
      root.dataset.mode=state.mode;root.dataset.stage=state.stage;root.dataset.result=state.result||'none';root.dataset.phase=state.demoPhase;root.dataset.buttonStyle=options.buttonStyle;
      all('.mc-step').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===state.stage)));
      q('.mc-heading').textContent=state.complete?(state.damage?'Útok!':'Bez zásahu'):state.mode.startsWith('demo')?'Krokodýl má hlad':state.stage===3?'Vyber znaménko':'Vyber tlamu';
      const pair=values();
      all('.mc-operand').forEach((el,i)=>{el.classList.remove('mc-emphasis');el.innerHTML=operand(pair[i]);el.setAttribute('aria-label',state.stage===0?(pair[i]===5?'Velké jablko':pair[i]===2?'Malé jablko':'Stejné jablko'):`${pair[i]}`);});
      q('.mc-slot').innerHTML='';q('.mc-slot').classList.remove('filled');q('.mc-slot').setAttribute('aria-label','Prázdné místo pro znaménko');
      q('.mc-answers').innerHTML=['<','=','>'].map(sign=>`<div class="mc-choice"><div class="mc-memory" aria-hidden="true">${glyph(sign)}</div><button class="mc-answer" type="button" data-sign="${sign}" aria-label="${glyphName(sign)}"><span class="mc-button-surface">${glyph(sign,state.stage===3)}</span></button></div>`).join('');
      q('.mc-problem').hidden=state.complete;q('.mc-answers').hidden=state.complete;q('.mc-complete').style.display=state.complete?'grid':'none';
      summary();status('');buttons();armHint();
    }
    function reveal(sign,plain=state.stage===3){q('.mc-slot').innerHTML=glyph(sign,plain);q('.mc-slot').classList.add('filled');q('.mc-slot').setAttribute('aria-label',glyphName(sign));}
    function cancel(){hideHint();state.token++;root.getAnimations({subtree:true}).forEach(a=>a.cancel());all('.mc-flying,.mc-hand,.mc-pair').forEach(e=>e.remove());state.busy=false;}
    async function delay(ms,token){await new Promise(resolve=>setTimeout(resolve,ms/options.demoSpeed));return state.token===token;}
    async function animate(el,keyframes,ms,token){if(reduced()){return state.token===token;}const a=el.animate(keyframes,{duration:ms/options.demoSpeed,easing:'ease-in-out',fill:'forwards'});await a.finished.catch(()=>{});return state.token===token;}
    function boardOrigin(){const board=q('.mc-board'),b=board.getBoundingClientRect(),s=getComputedStyle(board);return{x:b.x+parseFloat(s.borderLeftWidth),y:b.y+parseFloat(s.borderTopWidth)};}
    function floating(mark,source){const board=boardOrigin();const el=document.createElement('div');el.className='mc-flying';el.innerHTML=mark;Object.assign(el.style,{left:`${source.x-board.x}px`,top:`${source.y-board.y}px`,width:`${source.width}px`,height:`${source.height}px`});q('.mc-board').appendChild(el);return el;}
    function glyphBounds(svg){const b=svg.getBoundingClientRect(),height=Math.min(b.height,b.width*220/240),width=height*240/220;return{x:b.x+(b.width-width)/2,y:b.y+(b.height-height)/2,width,height};}
    async function insert(sign,token,teaching){
      const source=glyphBounds(all('.mc-answer').find(b=>b.dataset.sign===sign).querySelector('svg'));
      const plain=state.stage===3&&!teaching;
      reveal(sign,plain);const symbol=q('.mc-slot svg');symbol.style.visibility='hidden';const target=glyphBounds(symbol);
      const el=floating(glyph(sign,plain),source);
      const dest={dx:target.x-source.x,dy:target.y-source.y,sx:target.width/source.width};
      el.style.transformOrigin='0 0';
      if(!await animate(el,[{transform:'translate(0,0)'},{transform:`translate(${dest.dx}px,${dest.dy}px) scale(${dest.sx})`}],teaching?650:300,token)){el.remove();return false;}
      el.remove();symbol.style.visibility='';return true;
    }
    function pairUp(token){
      const row=q('.mc-problem');const b=row.getBoundingClientRect();const left=[...q('[data-side="left"]').querySelectorAll('.mc-fruit,.mc-number-only')],right=[...q('[data-side="right"]').querySelectorAll('.mc-fruit,.mc-number-only')];
      const overlay=document.createElementNS('http://www.w3.org/2000/svg','svg');overlay.classList.add('mc-pair');overlay.setAttribute('viewBox',`0 0 ${b.width} ${b.height}`);overlay.setAttribute('aria-hidden','true');
      const rb=q('.mc-row').getBoundingClientRect();Object.assign(overlay.style,{left:`${b.x-rb.x}px`,top:`${b.y-rb.y}px`,width:`${b.width}px`,height:`${b.height}px`});
      left.forEach((item,i)=>{for(const el of [item,right[i]]){const r=el.getBoundingClientRect();const ring=document.createElementNS('http://www.w3.org/2000/svg','ellipse');for(const [k,v]of Object.entries({cx:r.x+r.width/2-b.x,cy:r.y+r.height/2-b.y,rx:r.width*.48,ry:r.height*.48,fill:'none',stroke:'#708a39','stroke-width':2.5}))ring.setAttribute(k,String(v));overlay.appendChild(ring);if(!reduced())ring.animate([{opacity:.1},{opacity:1,offset:.4},{opacity:.6}],{duration:550/options.demoSpeed,delay:i*370/options.demoSpeed,fill:'both'});}});q('.mc-row').appendChild(overlay);
    }
    async function eat(sign,token,fast=false){
      if(sign==='='){pairUp(token);return delay(fast?400:1100,token);}
      const source=q(`[data-side="${sign==='>'?'left':'right'}"]`);const target=q('.mc-slot').getBoundingClientRect();
      const pieces=[...source.querySelectorAll('.mc-fruit,.mc-number-only')];
      for(const piece of pieces){
        if(state.token!==token)return false;
        const box=piece.getBoundingClientRect();const clone=floating(piece.outerHTML,box);piece.style.opacity='0';
        const done=await animate(clone,[{transform:'translate(0,0)',opacity:1},{transform:`translate(${target.x+target.width/2-box.x-box.width/2}px,${target.y+target.height/2-box.y-box.height/2}px) scale(.2)`,opacity:0}],fast?120:370,token);
        clone.remove();if(!done)return false;
      }
      if(!await delay(fast?60:180,token))return false;
      pieces.forEach(p=>p.style.opacity='');return true;
    }
    function phase(name){state.demoPhase=name;root.dataset.phase=name;}
    async function demo(){
      cancel();const token=state.token;state.busy=true;state.mode='demo';state.result=null;state.selected=null;state.complete=false;
      const count=3;
      for(let i=0;i<count;i++){
        state.demoIndex=i;phase('empty');state.selected=null;render();
        if(!await delay(800,token))return;
        const sign=relation();phase('notice');
        const sides=sign==='='?all('.mc-operand'):[q(`[data-side="${sign==='>'?'left':'right'}"]`)];sides.forEach(e=>e.classList.add('mc-emphasis'));
        if(!await delay(550,token))return;
        phase('choose');state.selected=sign;buttons();
        const btn=all('.mc-answer').find(b=>b.dataset.sign===sign),bb=btn.getBoundingClientRect(),board=boardOrigin();
        const hand=document.createElement('span');hand.className='mc-hand';hand.innerHTML='<i data-lucide="hand" aria-hidden="true"></i>';hand.style.left=`${bb.x+bb.width/2-board.x-21}px`;hand.style.top=`${bb.bottom-board.y-7}px`;q('.mc-board').appendChild(hand);icons();
        if(!await delay(400,token))return;
        hand.remove();if(!await insert(sign,token,true))return;
        phase('eat');if(!await eat(sign,token))return;
        sides.forEach(e=>e.classList.remove('mc-emphasis'));
        if(state.stage===3)reveal(sign,true);
        phase('relation');status(sign==='='?'Stejně!':'Mňam!');
        if(!await delay(900,token))return;
      }
      state.busy=false;state.mode='demo-done';phase('done');root.dataset.mode=state.mode;buttons();
    }
    function advance(){
      state.index++;state.complete=state.index>=practice[state.stage].length;if(state.complete)state.index=practice[state.stage].length-1;
      state.busy=false;state.result=null;state.selected=null;state.hintUsed=false;phase('none');render();
    }
    async function answer(sign){
      if(state.busy||state.mode!=='practice'||state.result!==null||state.complete)return;
      const helped=state.hintUsed;hideHint();
      const button=all('.mc-answer').find(b=>b.dataset.sign===sign);
      const correct=sign===relation(),token=state.token;state.busy=true;state.result=correct?'correct':'wrong';root.dataset.result=state.result;
      state.results.push(correct);state.assisted.push(helped);recordSupport(correct);if(correct)state.damage++;summary();buttons();
      if(!correct){button.classList.add('wrong');status('Podívej');if(!await delay(650,token))return;}
      state.selected=relation();buttons();
      if(!await insert(relation(),token,!correct))return;
      if((state.stage<3||!correct)&&!await eat(relation(),token,correct))return;
      if(state.stage===3)reveal(relation(),true);
      phase('feedback');status(correct?(sign==='='?'Stejně!':'Správně!'):'');
      if(!await delay(correct?750:1200,token))return;
      advance();
    }
    function changeStage(index){cancel();state.stage=index;state.index=0;state.mode='practice';state.result=null;state.selected=null;state.complete=false;state.demoPhase='none';state.results=[];state.assisted=[];state.hintUsed=false;state.damage=0;render();}
    root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
      if(b.dataset.stage!==undefined){changeStage(Number(b.dataset.stage));return;}
      if(b.dataset.sign){answer(b.dataset.sign);return;}
      if(b.dataset.action==='replay'){demo();return;}
      if(b.dataset.action==='main'){
        if(state.complete){changeStage(state.stage);return;}
        if(state.mode==='demo-done'){cancel();state.mode='practice';state.result=null;state.selected=null;state.demoPhase='none';render();return;}
        demo();
      }
    });
    let priorWidth=0;new ResizeObserver(entries=>{const width=entries[0].contentRect.width;if(priorWidth&&Math.abs(width-priorWidth)>2&&state.busy){const committed=state.mode==='practice'&&state.results.length>state.index;cancel();state.mode='practice';if(committed)advance();else{state.result=null;state.selected=null;render();}}priorWidth=width;}).observe(q('.mc-board'));
    q('.mc-board').style.setProperty('--board-art',`url("${q('.mc-board-art').src}")`);
    render();
    if(globalThis.Tweak){const tweak=new Tweak({container:q('.mc-board'),onChange:()=>{root.dataset.buttonStyle=options.buttonStyle;armHint();}});tweak.addSelect(options,'hintSchedule',{label:'Krokodýlí nápověda',options:[{label:'Postupně ubývá',value:'progress'},{label:'Hned',value:'0'},{label:'Po 3 sekundách',value:'3000'},{label:'Po 6 sekundách',value:'6000'},{label:'Po 10 sekundách',value:'10000'},{label:'Bez automatické nápovědy',value:'off'}]});tweak.addSelect(options,'buttonStyle',{label:'Podoba voleb',options:[{label:'Původní dřevěná tlačítka',value:'wood'},{label:'Světlé plochy',value:'light'}]});tweak.addSlider(options,'demoSpeed',{label:'Rychlost ukázky',min:.7,max:1.5,step:.1});}
  })();
  </script>
</div>
