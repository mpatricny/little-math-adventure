<script>
// Window-local memory storage prevents imported game helpers from reading or
// migrating a real profile. No browser storage is read, cleared, or overwritten.
class PreviewStorage {
 #values=new Map();
 get length(){return this.#values.size}
 key(index){return [...this.#values.keys()][index]??null}
 getItem(key){return this.#values.get(String(key))??null}
 setItem(key,value){this.#values.set(String(key),String(value))}
 removeItem(key){this.#values.delete(String(key))}
 clear(){this.#values.clear()}
}
Object.defineProperty(window,'localStorage',{value:new PreviewStorage()});
Object.defineProperty(window,'sessionStorage',{value:new PreviewStorage()});
</script>
