name: cislokraj-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cislokraj_dev
      POSTGRES_USER: cislokraj
      POSTGRES_PASSWORD: cislokraj
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cislokraj -d cislokraj_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - cislokraj-postgres-dev:/var/lib/postgresql/data

volumes:
  cislokraj-postgres-dev:
