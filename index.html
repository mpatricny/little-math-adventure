<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <title>Číslokraj: Tajemství krystalů</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #2d2d2d;
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      #game-container {
        /* Phaser owns centering for the canvas AND its HTML overlay. */
        position: absolute;
        left: calc(var(--game-viewport-left, 0px) + env(safe-area-inset-left, 0px));
        top: calc(var(--game-viewport-top, 0px) + env(safe-area-inset-top, 0px));
        width: 100%;
        height: 100%;
        width: calc(var(--game-viewport-width, 100vw) - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
        height: calc(var(--game-viewport-height, 100dvh) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
        overflow: hidden;
      }
      #game-container > div {
        /* Anchor Phaser's DOM layer to the same origin as the canvas. */
        top: 0;
        left: 0;
      }
      #game-container > canvas {
        display: block;
      }
      #game-container input {
        touch-action: manipulation;
        -webkit-touch-callout: default;
        -webkit-user-select: text;
        user-select: text;
      }
      #boot-error {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 32px;
        box-sizing: border-box;
        background: #111827;
        color: #facc15;
        font-family: Arial, sans-serif;
        font-size: 28px;
        line-height: 1.35;
        text-align: center;
      }
    </style>
    <script>
      window.__LMA_SHOW_BOOT_ERROR__ = function(message) {
        var el = document.getElementById('boot-error');
        if (!el) return;
        el.style.display = 'flex';
        el.style.color = '#fca5a5';
        el.textContent = 'Chyba při spuštění hry: ' + message;
      };
      window.addEventListener('error', function(event) {
        window.__LMA_SHOW_BOOT_ERROR__(event.message || 'neznamy JavaScript error');
      });
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        window.__LMA_SHOW_BOOT_ERROR__((reason && (reason.message || reason.toString())) || 'nezachycena promise chyba');
      });
    </script>
  </head>
  <body>
    <div id="boot-error" role="alert"></div>
    <div id="game-container"></div>
    <script src="/sdk/mesa-sdk.js"></script>
    <script>if(window.Mesa){Mesa.init().then(function(){console.log('[LMA] Mesa SDK initialized, env:', Mesa.getEnvironment());});}</script>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
